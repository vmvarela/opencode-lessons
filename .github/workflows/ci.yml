name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.0.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (syntax + tests)
        run: pnpm run verify
      - name: Offline release checks
        run: pnpm run check:release

      - name: Install OpenCode runtime fixture
        run: npm install --prefix "$RUNNER_TEMP/opencode-runtime" @opencode/cli@2.0.22 --no-audit --no-fund

      - name: Install Slim integration fixture
        run: npm install --prefix "$RUNNER_TEMP/slim-fixture" oh-my-opencode-slim@3.0.2 --ignore-scripts --no-audit --no-fund

      - name: Verify manual and automatic recall, alone and with Slim
        run: |
          for recall in false true; do
            LESSONS_SMOKE_RECALL="$recall" pnpm run test:runtime
            LESSONS_SMOKE_RECALL="$recall" SLIM_SMOKE_PLUGIN="$RUNNER_TEMP/slim-fixture/node_modules/oh-my-opencode-slim" pnpm run test:runtime
          done
        env:
          OPENCODE_SMOKE_CLI: ${{ runner.temp }}/opencode-runtime/node_modules/.bin/opencode
