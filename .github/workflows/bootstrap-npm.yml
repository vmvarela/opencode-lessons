name: Bootstrap npm release
on:
  push:
    branches: [master]
    paths: [.github/workflows/bootstrap-npm.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bootstrap-opencode-lessons
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'vmvarela/opencode-lessons' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 014ba782d589778aba9996eef64e4273d47ae40e
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify published bootstrap package matches this commit
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { mkdtempSync, readFileSync, writeFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const packed = JSON.parse(execFileSync('npm', ['pack', '--json', '--ignore-scripts'], { encoding: 'utf8' }))[0];
          const response = await fetch('https://registry.npmjs.org/opencode-lessons/0.1.2');
          assert.equal(response.status, 200);
          const published = await response.json();
          assert.equal(packed.version, published.version);
          const download = await fetch(published.dist.tarball);
          assert.equal(download.status, 200);
          const bytes = Buffer.from(await download.arrayBuffer());
          assert.equal(createHash('sha1').update(bytes).digest('hex'), published.dist.shasum);
          const directory = mkdtempSync(path.join(tmpdir(), 'published-lessons-'));
          try {
            const archive = path.join(directory, 'package.tgz');
            writeFileSync(archive, bytes);
            execFileSync('tar', ['-xzf', archive, '-C', directory]);
            const expected = ['LICENSE', 'README.md', 'index.js', 'package.json', 'src/index.js', 'src/store.js'];
            const inventory = execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' }).trim().split('\n').filter(name => !name.endsWith('/')).map(name => name.replace(/^package\//, '')).sort();
            assert.deepEqual(inventory, expected.sort());
            for (const file of expected) {
              const source = readFileSync(file);
              const released = readFileSync(path.join(directory, 'package', file));
              if (file === 'package.json') assert.deepEqual(JSON.parse(source), JSON.parse(released));
              else if (file === 'LICENSE') assert.equal(source.toString().replace(/\n+$/, '\n'), released.toString().replace(/\n+$/, '\n'), file);
              else assert.equal(source.compare(released), 0, file);
            }
          } finally { rmSync(directory, { recursive: true, force: true }); }
          console.log('Published package matches the bootstrap commit.');
          JS
      - name: Register the published version tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git rev-parse --verify refs/tags/v0.1.2 >/dev/null 2>&1; then
            test "$(git rev-parse refs/tags/v0.1.2)" = "014ba782d589778aba9996eef64e4273d47ae40e"
          else
            git tag v0.1.2 014ba782d589778aba9996eef64e4273d47ae40e
            git push origin refs/tags/v0.1.2
          fi
      - name: Record the first GitHub release
        run: |
          if ! gh release view v0.1.2 >/dev/null 2>&1; then
            gh release create v0.1.2 --verify-tag --title "v0.1.2" --notes "First npm publication of opencode-lessons. Includes Git-friendly Markdown lessons, scoped recall, reviewed acceptance and context promotion. Verified in OpenCode 2.0.22."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
